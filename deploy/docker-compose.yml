# Сайт на сервере projects. Порты 80/443 держит общий Caddy из aimuzov-projects/infra-server,
# он проксирует домен сюда по сети edge.

name: prestige-logist

x-logging: &logging
  driver: json-file
  options:
    max-size: '5m'
    max-file: '2'

services:
  site:
    build:
      context: ..
      secrets: [env]
    image: prestige-logist
    container_name: prestige-logist
    restart: unless-stopped
    networks:
      - edge
    logging: *logging

# Переменные сборки лежат в /srv/prestige-logist/.env, образец в .env.example.
secrets:
  env:
    file: ../.env

networks:
  edge:
    name: edge
    external: true
