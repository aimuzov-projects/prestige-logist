name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Выкладки идут по очереди, новая не обрывает уже начатую сборку.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check.yml

  # Пока сервер не подготовлен (ключ, клон в /srv, сайт в Caddy), выкладка пропускается.
  # Включается переменной репозитория DEPLOY_ENABLED=true. В самом infra-site-template её нет.
  deploy:
    needs: check
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://logist.aimuzov.online
    steps:
      - uses: aimuzov-projects/infra-site-kit/deploy@v1
        with:
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          url: https://logist.aimuzov.online
